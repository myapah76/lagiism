name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'lagiism-be/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test-and-push:
    name: Test & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: lagiism-be
        run: mvn -B test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./lagiism-be
          file: ./lagiism-be/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lagiism-be:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/lagiism-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: SSH Deploy with Healthcheck & Auto-Rollback
    needs: test-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}

            IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME }}/lagiism-be"
            NEW_IMAGE="${IMAGE_REPO}:${{ github.sha }}"
            PREV_IMAGE="${IMAGE_REPO}:previous"

            # Tag currently running backend image as :previous for rollback
            CURRENT_ID=$(docker inspect --format='{{.Image}}' lagiism-backend 2>/dev/null || true)
            if [ -n "$CURRENT_ID" ]; then
              docker tag "$CURRENT_ID" "$PREV_IMAGE"
            fi

            docker pull "$NEW_IMAGE"
            export BACKEND_IMAGE="$NEW_IMAGE"
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            # Poll /actuator/health for up to 90s
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                HEALTHY=1
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Healthcheck failed! Rolling back to ${PREV_IMAGE}..."
              if docker image inspect "$PREV_IMAGE" >/dev/null 2>&1; then
                export BACKEND_IMAGE="$PREV_IMAGE"
                docker compose -f docker-compose.prod.yml up -d --no-deps backend
              fi
              exit 1
            fi

            echo "Deployment succeeded for ${NEW_IMAGE}"
            docker image prune -f
