name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Maven Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lagiism-be
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: mvn -B test

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lagiism-fe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lagiism-fe/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Lint
        run: npm run lint

      - name: Production Build
        run: npm run build
