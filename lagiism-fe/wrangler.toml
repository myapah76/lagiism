name = "lagiism-fe"
main = "worker.js"
compatibility_date = "2026-01-01"

[build]
command = "npm install && npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/actuator/*"]

[vars]
API_ORIGIN = "https://api.yourdomain.com"
