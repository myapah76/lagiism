<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>LAGIISM Password Recovery</title>
</head>
<body style="margin:0;padding:32px;background:#ffffff;color:#000000;font-family:Inter,Arial,sans-serif;">
<div style="max-width:480px;margin:0 auto;border:1px solid #000000;padding:32px;">
    <p style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#555555;margin:0;">
        LAGIISM // ADMIN SECURITY
    </p>
    <h1 style="font-size:22px;font-weight:900;letter-spacing:-0.02em;text-transform:uppercase;margin:12px 0 16px;">
        PASSWORD RECOVERY OTP
    </h1>
    <p style="font-size:14px;line-height:1.6;margin:0 0 24px;">
        Use the one-time verification code below to reset your LAGIISM Admin Portal password.
    </p>
    <div style="border:1px solid #000000;background:#F4F4F4;padding:20px;text-align:center;font-family:'Courier New',monospace;font-size:28px;font-weight:700;letter-spacing:0.25em;">
        <span th:text="${otpCode}">000000</span>
    </div>
    <p style="font-size:12px;color:#555555;margin:20px 0 0;">
        This code expires in <strong th:text="${expiryMinutes}">10</strong> minutes. If you did not request this reset, ignore this email.
    </p>
</div>
</body>
</html>
