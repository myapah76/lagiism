spring:
  application:
    name: lagiism-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lagiism}
    username: ${DB_USERNAME:lagiism}
    password: ${DB_PASSWORD:lagiism_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        name: LAGIISM_SESSION
        http-only: true
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@lagiism.com}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  security:
    encryption-key: ${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
    cookie-secure: false
    cookie-same-site: Lax
  jwt:
    secret: ${JWT_SECRET:lagiism-dev-jwt-secret-key-at-least-32-bytes-long!!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  redis:
    blacklist-enabled: true
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
