spring:
  datasource:
    url: jdbc:h2:mem:lagiism_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

app:
  cors:
    allowed-origins: http://localhost:3000
  admin:
    email: test-admin@lagiism.com
    password: TestPassword123!
  security:
    encryption-key: 0123456789abcdef0123456789abcdef
    cookie-secure: false
    cookie-same-site: Lax
  jwt:
    secret: lagiism-test-jwt-secret-key-at-least-32-bytes-long!!
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  redis:
    blacklist-enabled: false
  google:
    client-id: test-google-client-id.apps.googleusercontent.com
